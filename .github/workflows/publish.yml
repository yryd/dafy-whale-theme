name: Publish Package

# 仅由 tag 触发（打 v* 标签 = 发版）。
# 刻意不加 workflow_dispatch：npm 文档指出 workflow_dispatch / workflow_call 场景下
# trusted publisher 的校验会比对「调用方 workflow 名」，容易造成配置不匹配而 ENEEDAUTH。
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC 必需；缺失会导致 ENEEDAUTH
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 发布构建禁用缓存（npm 官方建议）

      # 1) 防止 tag 与 package.json 版本不一致导致发错版本
      # 2) 判定 dist-tag：npm 禁止裸发预发布版（须显式 --tag），故预发布走 next，正式版走 latest
      - name: 校验版本并判定 dist-tag
        id: release
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=v$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致，已中止发布"
            exit 1
          fi
          case "$PKG" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "dist-tag=$DIST_TAG"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # 幂等守卫：该版本已存在于 registry 时跳过发布。
      # 于是重推同一个 tag（例如重写历史后）不再产生无谓的红色失败——
      # npm 本身也会以 E403 "cannot publish over the previously published versions" 拒绝覆盖。
      - name: 已发布则跳过
        id: guard
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$PKG 已存在，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ 本包已引入 TypeScript + 构建（v2.0.0 起）。
      # 必须在 publish 之前安装 devDependencies、编译到 lib/、跑护栏与测试，
      # 否则会把未构建的源码发出去（TS 源码不在 files 白名单内 → 发包即损坏）。
      # 认证走 OIDC trusted publishing，无需 NPM_TOKEN。
      - name: 安装依赖（含 devDependencies）
        if: steps.guard.outputs.skip == 'false'
        run: npm ci --include=dev

      - name: 构建（TS → lib/）
        if: steps.guard.outputs.skip == 'false'
        run: npm run build

      - name: 契约校验（DSH 契约 + schema 对齐）
        if: steps.guard.outputs.skip == 'false'
        run: npm run check

      - name: 运行测试
        if: steps.guard.outputs.skip == 'false'
        run: node --test test/*.test.mjs

      - if: steps.guard.outputs.skip == 'false'
        run: npm publish --tag ${{ steps.release.outputs.dist_tag }}
